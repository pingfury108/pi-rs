[workspace]
resolver = "2"
members = [
    "crates/pi-ai",
    "crates/pi-agent",
    "crates/pi-tools",
    "crates/pi-session",
    "crates/pi-core",
    "crates/pi-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
# async
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"
async-stream = "0.3"
futures = "0.3"
# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
# http / sse
reqwest = { version = "0.12", features = ["stream", "json", "rustls-tls"], default-features = false }
eventsource-stream = "0.2"
# errors
thiserror = "2"
anyhow = "1"
# misc
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# internal crates
pi-ai = { path = "crates/pi-ai" }
pi-agent = { path = "crates/pi-agent" }
pi-tools = { path = "crates/pi-tools" }
pi-session = { path = "crates/pi-session" }
pi-core = { path = "crates/pi-core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"

[profile.release]
lto = "thin"
strip = true
